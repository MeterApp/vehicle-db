name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Verify generated catalog
        run: |
          pnpm run build:data
          git diff --exit-code -- data/compact.json src/data.ts src/identity-data.ts

      - name: Preserve published selections
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_REF" ]] || ! git cat-file -e "$BASE_REF:data/compact.json" 2>/dev/null; then
            PACKAGE_NAME="$(node -p "require('./package.json').name")"
            PUBLISHED_VERSION="$(npm view "$PACKAGE_NAME" version)"
            if [[ ! "$PUBLISHED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Cannot determine a stable published compatibility baseline" >&2
              exit 1
            fi
            BASE_REF="refs/tags/v$PUBLISHED_VERSION"
            if ! git cat-file -e "$BASE_REF:data/compact.json" 2>/dev/null; then
              echo "Published compatibility baseline $BASE_REF is unavailable" >&2
              exit 1
            fi
          fi
          echo "Checking published selections against $BASE_REF"
          pnpm run check:compatibility "$BASE_REF"

      - name: Replay identity assertions
        run: pnpm run replay

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Audit production dependencies
        run: pnpm audit --prod
