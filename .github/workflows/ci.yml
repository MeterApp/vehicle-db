name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify generated catalog
        run: |
          npm run build:data
          git diff --exit-code -- data/compact.json src/data.ts src/identity-data.ts

      - name: Preserve published selections
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run check:compatibility -- "$BASE_REF"

      - name: Replay identity assertions
        run: npm run replay

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev
